name: cross-domain-direct-benchmark

on:
  pull_request:
    paths:
      - .github/workflows/cross-domain-direct-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FETCH_BENCHMARK_FIXTURE: fixtures/real-supplier-cross-domain-5.json
      FETCH_BENCHMARK_METHODS: direct
      FETCH_BENCHMARK_RUNS: "1"
      FETCH_BENCHMARK_OUTPUT: /tmp/cross-domain-direct.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Run five-request direct benchmark
        run: npm run benchmark:fetchers -- --live
      - name: Print scored summary
        run: jq '.summary' "$FETCH_BENCHMARK_OUTPUT"
      - name: Upload raw benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: cross-domain-direct-report
          path: ${{ env.FETCH_BENCHMARK_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
