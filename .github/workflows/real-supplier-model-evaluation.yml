name: real-supplier-model-evaluation

on:
  # Paid model evaluation is an explicit operation, never an automatic PR check.
  workflow_dispatch:
    inputs:
      evaluation_mode:
        description: Run the production cascade only, or include legacy/shared parallel comparison
        required: true
        type: choice
        default: both
        options:
          - production
          - both

permissions:
  contents: read

concurrency:
  group: real-supplier-model-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TYPESAFE_MODEL: jev-1.13.0
      AI_FALLBACK_PROVIDER: openrouter
      OPENROUTER_MODEL: deepseek/deepseek-v4.1-flash
      OPENROUTER_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
      REAL_SUPPLIER_FIXTURE: fixtures/real-supplier-validation-25.json
      REAL_SUPPLIER_EVAL_OUTPUT: /tmp/real-supplier-model-evaluation.json
      REAL_SUPPLIER_DATASET_ROLE: development
      REAL_SUPPLIER_EVAL_MODE: ${{ inputs.evaluation_mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Require model evaluation secrets
        run: |
          test -n "${JEV_API_KEY:-${TYPESAFE_API_KEY:-}}"
          test -n "${OPENROUTER_API_KEY:-}"
          curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            https://openrouter.ai/api/v1/models
      - name: Evaluate the production cascade and shared-input comparison
        run: npm run evaluate:real-suppliers -- --live
      - name: Enforce layered production-readiness gates
        run: |
          jq '{models: .summary.models, policies: .summary.policies, gates: .summary.gates}' "$REAL_SUPPLIER_EVAL_OUTPUT"
          jq -e '
            .summary.gates.evaluationValid == true and
            .summary.gates.serviceGatePass == true and
            .summary.gates.safetyGatePass == true and
            .summary.gates.coverageGatePass == true and
            .summary.gates.evaluationPass == true and
            .summary.gates.holdoutGatePass == false and
            .summary.gates.promotionEligible == false
          ' "$REAL_SUPPLIER_EVAL_OUTPUT"
      - name: Upload raw model evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-supplier-model-evaluation
          path: ${{ env.REAL_SUPPLIER_EVAL_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
