name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run evaluate:fixtures
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke

  browser-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag supplier-signal-browser-smoke .
      - name: Verify sandboxed Chromium runtime
        run: docker run --rm supplier-signal-browser-smoke npm run smoke:browser -- --live
